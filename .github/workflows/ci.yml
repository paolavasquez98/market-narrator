name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finrag
          POSTGRES_PASSWORD: finrag
          POSTGRES_DB: finrag
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U finrag -d finrag"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group dev

      - name: Apply database schema
        run: psql "postgresql://finrag:finrag@localhost:5432/finrag" -f src/finrag/knowledge_base/schema.sql
        env:
          PGPASSWORD: finrag

      - name: Lint
        run: uv run ruff check src tests eval ui

      - name: Test
        run: uv run pytest

  docker-build:
    runs-on: ubuntu-latest
    # Separate job from lint-and-test: this only proves the images build,
    # not that the app works end-to-end (that needs GROQ_API_KEY and a
    # running stack, which CI doesn't have) -- but a build-only check
    # would have caught the missing-README.md Dockerfile issue found
    # during Day 7/8 development before it needed a local `docker build`
    # to discover, and costs nothing when it stays green.
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f Dockerfile.api -t market-narrator-api:ci .

      - name: Build UI image
        run: docker build -f Dockerfile.ui -t market-narrator-ui:ci .
