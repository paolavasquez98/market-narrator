name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finrag
          POSTGRES_PASSWORD: finrag
          POSTGRES_DB: finrag
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U finrag -d finrag"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group dev

      - name: Apply database schema
        run: psql "postgresql://finrag:finrag@localhost:5432/finrag" -f src/finrag/knowledge_base/schema.sql
        env:
          PGPASSWORD: finrag

      - name: Lint
        run: uv run ruff check src tests eval ui

      - name: Test
        run: uv run pytest
